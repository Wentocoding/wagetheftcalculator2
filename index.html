<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薪水小偷精算師 6.0 (法規依據版)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-red: #c0392b;
            --deep-red: #8b0000;
            --semester-color: #3498db;
            --break-color: #e67e22;
            --allowance-color: #d35400;
            --bonus-color: #f1c40f;
            --bonus-text: #7f6000;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .calculator-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-top: 5px solid var(--accent-red);
            margin-bottom: 50px;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--primary-color);
            font-size: 0.9rem;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            border-color: var(--primary-color);
            outline: none;
            background-color: #fffdf0;
        }

        /* 1. 薪資結構區 */
        .salary-basis-section {
            background-color: #e8f6f3;
            border: 1px solid #d1f2eb;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .salary-basis-title {
            color: #16a085;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 2px solid #16a085;
            padding-bottom: 5px;
        }
        .total-salary-display {
            text-align: right;
            font-size: 1.2rem;
            font-weight: bold;
            color: #16a085;
            margin-top: 10px;
        }

        /* 2. 獎金計算區 */
        .bonus-section {
            background-color: #fffcf5;
            border: 2px solid var(--bonus-color);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            position: relative;
        }
        .bonus-title {
            color: var(--bonus-text);
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--bonus-color);
            padding-bottom: 8px;
        }
        .bonus-result {
            margin-top: 15px;
            padding: 10px;
            background-color: #fff;
            border-radius: 6px;
            border: 1px solid #eee;
        }
        .bonus-loss-display {
            color: var(--deep-red);
            font-weight: bold;
            font-size: 1.1rem;
            text-align: right;
        }

        /* 3. 身份與雜項區 */
        .settings-section {
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        /* 法規備註 */
        .legal-note {
            font-size: 0.8rem;
            color: #666;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
            line-height: 1.4;
        }
        .legal-note a {
            color: #2980b9;
            text-decoration: none;
        }
        .legal-note a:hover {
            text-decoration: underline;
        }

        /* 區塊通用 */
        .period-block {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            position: relative;
        }

        .period-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sem-style { color: var(--semester-color); border-color: var(--semester-color); }
        .break-style { color: var(--break-color); border-color: var(--break-color); }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: flex-end;
        }
        
        .three-col {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .input-group {
            flex: 1;
        }

        .subtotal-tag {
            font-size: 0.9rem;
            color: #fff;
            background-color: #95a5a6;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .extra-loss-label { color: var(--deep-red) !important; }
        .extra-loss-input { border-color: var(--accent-red) !important; background-color: #fff5f5; }

        /* 結果區 */
        .total-loss {
            margin-top: 30px;
            background-color: #ffebee;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 3px solid #ffcdd2;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .total-loss h3 { margin: 0; font-size: 1.1rem; color: #c62828; }
        .total-loss .amount { font-size: 3rem; font-weight: 800; color: #c62828; margin-top: 10px; text-shadow: 1px 1px 0px rgba(0,0,0,0.1); }
        .loss-breakdown { font-size: 0.85rem; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

<div class="calculator-card">
    <h1>薪水小偷精算師 6.0</h1>
    <div class="subtitle">法規依據版：這不是感覺，這是數學與法律</div>

    <div class="salary-basis-section">
        <div class="salary-basis-title">💰 STEP 1: 薪資結構 (計算獎金基數)</div>
        <div class="input-row three-col">
            <div class="input-group">
                <label>本俸 (本薪)</label>
                <input type="number" id="base_salary" placeholder="輸入金額" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>學術研究費</label>
                <input type="number" id="research_fee" placeholder="輸入金額" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>主管/職務加給</label>
                <input type="number" id="boss_allowance" placeholder="若無填0" value="0" oninput="calculate()">
            </div>
        </div>
        <div class="total-salary-display" id="monthlySalaryDisplay">
            全薪合計: $0
        </div>
        <div style="font-size:0.8rem; color:#666; margin-top:5px;">
            * 依教育部標準，年終與考績獎金應以「全薪」計算。
        </div>
    </div>

    <div class="bonus-section">
        <div class="bonus-title">
            <span>🧧 STEP 2: 年終與考績獎金差額</span>
            <span class="subtotal-tag" style="background:#f39c12;" id="sub_bonus">$0</span>
        </div>
        <div class="input-row">
            <div class="input-group">
                <label>考績等級</label>
                <select id="perf_grade" onchange="calculate()">
                    <option value="1.0">甲等 (1.0個月)</option>
                    <option value="0.5">乙等 (0.5個月)</option>
                    <option value="0">無 / 丙等</option>
                </select>
            </div>
            <div class="input-group">
                <label>年終基數</label>
                <input type="text" value="1.5 個月" disabled style="background:#eee; color:#777;">
            </div>
        </div>
        <div class="bonus-result">
            <div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:5px;">
                <span>應領年終 (1.5):</span>
                <span id="expected_year_end_display" style="font-weight:bold;">$0</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:5px;">
                <span>應領考績:</span>
                <span id="expected_perf_display" style="font-weight:bold;">$0</span>
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label style="color:var(--text-color);">實際收到年終</label>
                    <input type="number" id="actual_year_end" placeholder="存摺金額" oninput="calculate()">
                </div>
                <div class="input-group">
                    <label style="color:var(--text-color);">實際收到考績</label>
                    <input type="number" id="actual_perf" placeholder="存摺金額" oninput="calculate()">
                </div>
            </div>
            <div class="bonus-loss-display" id="bonus_gap_display">
                獎金短少: $0
            </div>
        </div>
    </div>

    <div class="settings-section">
        <div class="period-title" style="border:none; margin-bottom:10px;">🛠️ STEP 3: 鐘點與加給設定</div>
        
        <div class="form-group" style="margin-bottom:15px;">
            <label for="role">基本身份 (影響基本鐘點)</label>
            <select id="role" onchange="handleRoleChange()">
                <option value="16">專任教師 (基本16)</option>
                <option value="13">班級導師 (基本13)</option>
                <option value="2">兼任行政 (基本2)</option> </select>
            <div style="font-size:0.8rem; color:#e67e22; margin-top:5px;">* 選擇「專任教師」將自動追加 3 節基本鐘點。</div>
        </div>

        <div style="border-top:1px dashed #ccc; padding-top:10px;">
            <div class="input-row">
                <div class="input-group" style="flex: 2;">
                    <label style="color:var(--allowance-color);">每月加給"短少"金額</label>
                    <input type="number" id="monthly_allowance" placeholder="如: 沒給導師費3000" min="0" oninput="calculate()">
                </div>
                <div class="input-group">
                    <label>計算月數</label>
                    <input type="number" id="allowance_months" value="12" min="0" oninput="calculate()">
                </div>
            </div>
            <div style="text-align:right; font-size:0.9rem; color:var(--allowance-color);" id="allowanceTotalDisplay">年損: $0</div>
        </div>

        <div class="legal-note">
            備註：輔導課支給550元是依照 <a href="https://www.k12ea.gov.tw/Tw/Station/AffairDetail?filter=63F293A9-0155-41A3-97B7-46E43E4685FE&id=4a80ec93-5d8a-47bb-b290-af3d893e0300" target="_blank">高級中等學校學生學習扶助方案</a>
        </div>
    </div>

    <div class="period-block" style="border-left: 5px solid var(--semester-color);">
        <div class="period-title sem-style">
            <span>上學期 (Regular)</span>
            <span class="subtotal-tag" id="sub_sem1">$0</span>
        </div>
        
        <div class="input-row">
            <div class="input-group">
                <label class="extra-loss-label">🔥 追加基本鐘點</label>
                <input type="number" id="sem1_add" placeholder="每週幾節" class="extra-loss-input" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>上課週數</label>
                <input type="number" id="sem1_weeks" value="20" oninput="calculate()">
            </div>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label>正規課 / 週 <span style="font-size:0.8rem; color:#666;">(1-7節)</span></label>
                <input type="number" id="sem1_reg" placeholder="總節數" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>輔導課 / 週 <span style="font-size:0.8rem; color:#666;">(8-9節/夜/六)</span></label>
                <input type="number" id="sem1_tut" placeholder="總節數" oninput="calculate()">
            </div>
        </div>
    </div>

    <div class="period-block" style="border-left: 5px solid var(--semester-color);">
        <div class="period-title sem-style">
            <span>下學期 (Regular)</span>
            <span class="subtotal-tag" id="sub_sem2">$0</span>
        </div>
        
        <div class="input-row">
            <div class="input-group">
                <label class="extra-loss-label">🔥 追加基本鐘點</label>
                <input type="number" id="sem2_add" placeholder="每週幾節" class="extra-loss-input" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>上課週數</label>
                <input type="number" id="sem2_weeks" value="20" oninput="calculate()">
            </div>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label>正規課 / 週 <span style="font-size:0.8rem; color:#666;">(1-7節)</span></label>
                <input type="number" id="sem2_reg" placeholder="總節數" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>輔導課 / 週 <span style="font-size:0.8rem; color:#666;">(8-9節/夜/六)</span></label>
                <input type="number" id="sem2_tut" placeholder="總節數" oninput="calculate()">
            </div>
        </div>
    </div>

    <div class="period-block" style="border-left
